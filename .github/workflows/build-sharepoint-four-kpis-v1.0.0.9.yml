name: Build Coexistence SharePoint Four KPIs v1.0.0.9
on:
  workflow_dispatch:
  push:
    branches: [feature/sharepoint-four-kpis-v1.0.0.9]
    paths: ['spfx/**','.github/workflows/build-sharepoint-four-kpis-v1.0.0.9.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spfx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SPFx dependencies
        run: npm install --no-audit --no-fund
      - name: Generate pinned CSP-safe source and verify
        run: npm run prepare-dashboard && npm run check && node --check src/webparts/coexistenceDashboard/dashboardRuntime.js
      - name: Run supplied financial UI regression test
        run: mkdir -p ../../dashboard_html && cp ../coexistence.js ../workers-filter.js ../../dashboard_html/ && node ../test_four_kpi_runtime.cjs
      - name: Official Microsoft SPFx production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Coexistence-SharePoint-Four-KPIs-v1.0.0.9
          path: spfx/sharepoint/solution/*.sppkg
          if-no-files-found: error
