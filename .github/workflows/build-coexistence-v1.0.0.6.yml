name: Build Coexistence SPFx v1.0.0.6
on:
  workflow_dispatch:
  push:
    branches: [fix/coexistence-spfx-v1.0.0.6]
    paths: ['spfx/**', '.github/workflows/build-coexistence-v1.0.0.6.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spfx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate CSP-safe source and verify
        run: npm run prepare-dashboard && npm run check && node --check src/webparts/coexistenceDashboard/dashboardRuntime.js
      - name: Build genuine SPFx package
        run: npm run build
      - name: Publish package for download
        uses: actions/upload-artifact@v4
        with:
          name: Coexistence-Dashboard-v1.0.0.6-sppkg
          path: spfx/sharepoint/solution/*.sppkg
          if-no-files-found: error
